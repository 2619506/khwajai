<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60Smart Space Broadcast</title>
    <!-- Khwaja AI Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS: Khwaja AI / 60Smart Unified Design */
        :root {
            --bg-dark: #000000;
            --bg-panel: rgba(15, 23, 42, 0.75); /* Khwaja AI Glass */
            --accent: #00ffcc; /* Khwaja AI Neon */
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; 
        }

        body {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Outfit', sans-serif;
        }

        .broadcast-container {
            display: flex;
            height: 680px;
            width: 100%;
        }

        /* --- SIDEBAR (Glassmorphism) --- */
        .sidebar {
            width: 340px;
            background: var(--bg-panel);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0, 255, 204, 0.2);
            z-index: 50;
            position: relative;
        }

        .brand-container {
            padding: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .brand-logo span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .weather-widget {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-city {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weather-temp {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .queue-container {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .queue-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        
        .queue-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .queue-item { opacity: 0.5; transition: opacity 0.3s; }
        .queue-item.active {
            opacity: 1;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-left: -13px;
            box-shadow: -5px 0 10px -5px var(--accent);
        }
        .queue-source { 
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem; 
            color: var(--accent); 
            margin-bottom: 4px; 
            letter-spacing: 1px;
        }
        .queue-title {
            font-size: 0.95rem; font-weight: 400; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            color: var(--text-main);
        }

        /* The Smoke/Fade effect perfectly matching the dark glass sidebar */
        .queue-smoke-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: linear-gradient(to top, rgba(15, 23, 42, 1) 10%, transparent 100%);
            pointer-events: none;
            z-index: 10;
        }

        /* --- MAIN CONTENT (SPACE THEME) --- */
        .main-stage {
            flex: 1;
            position: relative;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        /* Canvas Space Background */
        #space-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* The Black Hole */
        .bh-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .bh-core {
            width: 120px;
            height: 120px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 50px 10px var(--accent-glow), inset 0 0 15px 2px rgba(0, 255, 204, 0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        /* Pulse effect when rocket hits */
        .bh-core.pulse {
            box-shadow: 0 0 150px 40px rgba(255, 255, 255, 0.9), inset 0 0 40px 10px var(--accent);
            transform: translate(-50%, -50%) scale(1.2);
        }

        .bh-accretion-disk {
            width: 350px;
            height: 350px;
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 204, 0.1);
            border-left: 3px solid rgba(0, 255, 204, 0.7);
            border-right: 3px solid rgba(0, 255, 204, 0.7);
            box-shadow: 0 0 20px 2px var(--accent-glow);
            animation: spinDisk 3s linear infinite;
        }

        @keyframes spinDisk {
            from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* Rocket Animation */
        .rocket {
            position: absolute;
            left: 50%;
            top: -100px;
            color: var(--accent);
            font-size: 2.5rem;
            transform: translateX(-50%) rotate(180deg); 
            z-index: 20;
            opacity: 0;
            filter: drop-shadow(0 -10px 15px var(--accent));
        }

        @keyframes rocketDive {
            0% { top: -100px; opacity: 1; transform: translateX(-50%) rotate(180deg) scale(1); }
            70% { top: 35%; opacity: 1; transform: translateX(-50%) rotate(180deg) scale(0.6); }
            100% { top: 40%; opacity: 0; transform: translateX(-50%) rotate(180deg) scale(0); }
        }

        /* Transparent Text Content Area */
        .story-content {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 40px 50px;
            z-index: 15;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .story-tags { display: flex; gap: 15px; margin-bottom: 15px; }
        
        /* Khwaja AI Telemetry Chip Style */
        .tag { 
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 5px 12px; 
            font-size: 0.75rem; 
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase; 
            border-radius: 20px; 
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        
        .tag.source { border-color: #ffffff; color: #ffffff; background: rgba(255,255,255,0.1); }

        .story-headline {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem; font-weight: 700; line-height: 1.1; margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8), 0 0 30px rgba(0, 255, 204, 0.4), 0 0 5px #fff;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            letter-spacing: 1px;
        }

        .story-description {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem; line-height: 1.5; color: var(--text-muted); max-width: 800px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            font-weight: 300;
        }

        /* --- TICKER TAPE --- */
        .ticker {
            height: 40px; background-color: var(--accent); color: #000;
            display: flex; align-items: center; padding: 0 20px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: 800; font-size: 1rem; letter-spacing: 1px; z-index: 60;
            box-shadow: 0 -5px 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="broadcast-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-container">
                <div class="brand-logo">60<span>Smart</span></div>
            </div>
            
            <div class="weather-widget">
                <div class="weather-city" id="weather-city">SYSTEM CHECK</div>
                <div class="weather-temp">
                    <i id="weather-icon" class="fa-solid fa-satellite-dish"></i>
                    <span id="weather-temp">ON</span>
                </div>
            </div>

            <div class="queue-container">
                <div class="queue-header">UPCOMING TELEMETRY</div>
                <div class="queue-list-wrapper" id="queue-list">
                    <!-- Queue populates here -->
                </div>
                <!-- Smoke/Fade effect -->
                <div class="queue-smoke-overlay"></div>
            </div>
        </div>

        <!-- Main Content (Space Stage) -->
        <div class="main-stage">
            
            <!-- Dynamic Khwaja AI Canvas Starfield -->
            <canvas id="space-canvas"></canvas>

            <!-- Black Hole Event Horizon -->
            <div class="bh-container">
                <div class="bh-accretion-disk"></div>
                <div class="bh-core" id="bh-core"></div>
            </div>

            <!-- Falling Rocket Graphic -->
            <i class="fa-solid fa-rocket rocket" id="rocket-anim"></i>

            <!-- Transparent News Text Content -->
            <div class="story-content" id="story-content">
                <div class="story-tags">
                    <span class="tag category" id="main-category">SYSTEM</span>
                    <span class="tag source" id="main-source">NETWORK</span>
                </div>
                <h1 class="story-headline" id="main-headline">Initializing Neural Network...</h1>
                <p class="story-description" id="main-description">Calibrating spatial sensors and aggregating global data feeds.</p>
            </div>
        </div>
    </div>

    <!-- Bottom Ticker -->
    <div class="ticker">
        <!-- STAND BY has been removed -->
        <div class="ticker-text" id="ticker-text">60SMART NETWORK | INITIALIZING DATABANKS</div>
    </div>

    <!-- Javascript -->
    <script>
        // --- KHWAJA AI CANVAS SPACE BACKGROUND ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const stage = document.querySelector('.main-stage');
        let stars = [], meteors = [];

        function resizeCanvas() {
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createStars(count) {
            stars = [];
            const starColors = ['#ffffff', '#ffffff', '#e0f0ff', '#b3d4ff', '#ffddaa', '#00ffcc'];
            for(let i=0; i<count; i++){
                let size = Math.random() < 0.95 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.5 + 0.8;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 0.05 + 0.01,
                    size: size,
                    color: starColors[Math.floor(Math.random() * starColors.length)],
                    alpha: Math.random(),
                    alphaChange: (Math.random() * 0.01 + 0.002) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }

        function createMeteors(count) {
            meteors = [];
            for(let i=0; i<count; i++){
                meteors.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speedX: -(Math.random() * 4 + 2),
                    speedY: Math.random() * 2 + 1,
                    length: Math.random() * 50 + 30
                });
            }
        }

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(const s of stars){
                s.alpha += s.alphaChange;
                if(s.alpha <= 0.05) { s.alpha = 0.05; s.alphaChange *= -1; }
                if(s.alpha >= 1) { s.alpha = 1; s.alphaChange *= -1; }

                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.color;
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                
                // Draw the glowing cross for larger stars
                if (s.size > 1.4) {
                    ctx.globalAlpha = s.alpha * 0.6;
                    ctx.beginPath();
                    ctx.moveTo(s.x - s.size * 6, s.y);
                    ctx.lineTo(s.x + s.size * 6, s.y);
                    ctx.moveTo(s.x, s.y - s.size * 6);
                    ctx.lineTo(s.x, s.y + s.size * 6);
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 0.3;
                    ctx.stroke();
                }

                s.y += s.speed;
                if(s.y > canvas.height){
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
            
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#00ffcc'; // Tinted meteors to match accent
            ctx.lineWidth = 0.8;
            for(const m of meteors){
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x + m.length * m.speedX / 10, m.y + m.length * m.speedY / 10);
                ctx.stroke();
                
                m.x += m.speedX;
                m.y += m.speedY;
                
                if(m.x < -100 || m.y > canvas.height + 100){
                    m.x = canvas.width + Math.random() * 200;
                    m.y = Math.random() * canvas.height / 2;
                }
            }
        }

        createStars(800);
        createMeteors(2);

        (function animateSpace(){
            drawSpace();
            requestAnimationFrame(animateSpace);
        })();


        // --- NEWS BROADCAST LOGIC ---
        const feeds = [
            { url: 'http://feeds.bbci.co.uk/news/world/rss.xml', category: 'WORLD', source: 'BBC' },
            { url: 'https://www.theguardian.com/world/rss', category: 'GLOBAL', source: 'THE GUARDIAN' },
            { url: 'https://www.aljazeera.com/xml/rss/all.xml', category: 'WORLD', source: 'AL JAZEERA' },
            { url: 'https://rss.cnn.com/rss/edition_world.rss', category: 'WORLD', source: 'CNN' },
            { url: 'https://moxie.foxnews.com/google-publisher/world.xml', category: 'WORLD', source: 'FOX NEWS' },
            { url: 'https://www.cbsnews.com/latest/rss/world', category: 'WORLD', source: 'CBS NEWS' },
            { url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml', category: 'ECONOMY', source: 'WALL ST JOURNAL' },
            { url: 'https://www.cnbc.com/id/10000664/device/rss/rss.html', category: 'FINANCE', source: 'CNBC MARKETS' },
            { url: 'http://feeds.marketwatch.com/marketwatch/topstories/', category: 'MARKETS', source: 'MARKETWATCH' },
            { url: 'https://rss.nytimes.com/services/xml/rss/nyt/Science.xml', category: 'SCIENCE', source: 'NY TIMES' },
            { url: 'https://www.wired.com/feed/category/science/latest/rss', category: 'RESEARCH', source: 'WIRED SCIENCE' },
            { url: 'https://www.nasa.gov/feeds/iotd-feed/', category: 'SPACE', source: 'NASA' },
            { url: 'https://techcrunch.com/feed/', category: 'TECH', source: 'TECHCRUNCH' },
            { url: 'https://www.theverge.com/rss/index.xml', category: 'TECHNOLOGY', source: 'THE VERGE' },
            { url: 'https://www.polygon.com/rss/index.xml', category: 'GAMING', source: 'POLYGON' }
        ];

        let newsLibrary = [];
        let currentIndex = 0;
        let broadcastTimer; 
        const rss2jsonProxy = 'https://api.rss2json.com/v1/api.json?rss_url=';

        const weatherCities = [
            { name: "KABUL", lat: 34.5281, lon: 69.1171 }, { name: "HERAT", lat: 34.3419, lon: 62.2031 },
            { name: "TOKYO", lat: 35.68, lon: 139.69 }, { name: "DUBAI", lat: 25.20, lon: 55.27 },
            { name: "LONDON", lat: 51.50, lon: -0.12 }, { name: "PARIS", lat: 48.85, lon: 2.35 },
            { name: "NEW YORK", lat: 40.71, lon: -74.00 }, { name: "SYDNEY", lat: -33.8688, lon: 151.2093 }
        ];
        weatherCities.sort(() => Math.random() - 0.5);
        let weatherIndex = 0;

        async function fetchWithTimeout(resource, options = { timeout: 5000 }) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        function getWeatherIcon(code) {
            if (code === 0) return 'fa-sun'; 
            if (code >= 1 && code <= 3) return 'fa-cloud-sun'; 
            if (code >= 51 && code <= 65) return 'fa-cloud-rain'; 
            if (code >= 71 && code <= 77) return 'fa-snowflake'; 
            return 'fa-cloud'; 
        }

        async function fetchWeather() {
            const city = weatherCities[weatherIndex];
            try {
                const res = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`, { timeout: 4000 });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('weather-city').innerText = city.name;
                    document.getElementById('weather-temp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                    document.getElementById('weather-icon').className = `fa-solid ${getWeatherIcon(data.current_weather.weathercode)}`;
                }
            } catch (e) { console.warn("Weather fetch skipped"); }
            weatherIndex = (weatherIndex + 1) % weatherCities.length;
        }

        let tickerItems = [];
        let currentTickerIndex = 0;
        function rotateTicker() {
            if (tickerItems.length === 0) return;
            const tickerEl = document.getElementById('ticker-text');
            tickerEl.style.opacity = 0; 
            setTimeout(() => {
                // STAND BY permanently removed.
                tickerEl.innerHTML = `BREAKING &nbsp;|&nbsp; ${tickerItems[currentTickerIndex]}`;
                tickerEl.style.opacity = 1;
                currentTickerIndex = (currentTickerIndex + 1) % tickerItems.length;
            }, 300); 
        }

        function updateScreen() {
            if (newsLibrary.length === 0) return;

            const article = newsLibrary[currentIndex];
            const contentEl = document.getElementById('story-content');
            const rocketEl = document.getElementById('rocket-anim');
            const bhCore = document.getElementById('bh-core');

            // 1. Fade out current text
            contentEl.style.opacity = 0;
            contentEl.style.transform = 'translateY(20px)';

            // 2. Launch the rocket down into the black hole
            rocketEl.style.animation = 'none';
            void rocketEl.offsetWidth; 
            rocketEl.style.animation = 'rocketDive 1s ease-in forwards';

            // 3. Wait for rocket to hit the center, then pulse and show news
            setTimeout(() => {
                
                // Black hole Pulse
                bhCore.classList.add('pulse');
                setTimeout(() => bhCore.classList.remove('pulse'), 300);

                // Update text fields
                document.getElementById('main-category').innerText = article.category;
                document.getElementById('main-source').innerText = article.source;
                document.getElementById('main-headline').innerText = article.title;
                document.getElementById('main-description').innerText = article.description;
                
                // Update Sidebar Queue (Smoke overlay covers the bottom natively in CSS)
                let queueHTML = '';
                const len = newsLibrary.length;
                const indices = [ currentIndex, (currentIndex + 1) % len, (currentIndex + 2) % len, (currentIndex + 3) % len, (currentIndex + 4) % len ];
                
                indices.forEach((idx, i) => {
                    let a = newsLibrary[idx];
                    let activeClass = (i === 0) ? 'active' : '';
                    queueHTML += `
                        <div class="queue-item ${activeClass}">
                            <div class="queue-source">${a.source.toUpperCase()} &bull; ${a.category}</div>
                            <div class="queue-title">${a.title}</div>
                        </div>`;
                });
                document.getElementById('queue-list').innerHTML = queueHTML;

                // Fade text back in immediately
                contentEl.style.opacity = 1;
                contentEl.style.transform = 'translateY(0)';

            }, 1000); 
        }

        async function fetchAllNews() {
            const headEl = document.getElementById('main-headline');
            if (headEl && newsLibrary.length === 0) { headEl.innerText = "CONNECTING TO GLOBAL FEEDS..."; }
            
            const shuffledFeeds = feeds.sort(() => 0.5 - Math.random()).slice(0, 8);
            let allArticles = [];

            for (const feed of shuffledFeeds) {
                try {
                    const response = await fetchWithTimeout(rss2jsonProxy + encodeURIComponent(feed.url), { timeout: 5000 });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'ok') {
                            const items = data.items.slice(0, 4).map(item => {
                                let cleanDesc = item.description ? item.description.replace(/<[^>]+>/g, '').trim() : "";
                                if(cleanDesc.length > 300) cleanDesc = cleanDesc.substring(0, 300) + '...';

                                return {
                                    title: item.title,
                                    description: cleanDesc || "Detailed report available on the official network site.",
                                    category: feed.category,
                                    source: feed.source
                                };
                            });
                            allArticles.push(...items);
                        }
                    }
                } catch (error) { console.warn(`Skipped feed ${feed.source}`); }
            }

            if (allArticles.length > 0) {
                newsLibrary = allArticles.sort(() => Math.random() - 0.5);
                tickerItems = newsLibrary.map(a => `${a.source.toUpperCase()}: ${a.title}`);
                currentIndex = 0; 
                
                updateScreen();
                setInterval(rotateTicker, 5000); 

                if (broadcastTimer) clearInterval(broadcastTimer);
                broadcastTimer = setInterval(() => {
                    if (newsLibrary.length > 0) {
                        currentIndex = (currentIndex + 1) % newsLibrary.length;
                        updateScreen();
                    }
                }, 15000); 
            } else if (newsLibrary.length === 0) {
                if (headEl) headEl.innerText = "API LIMIT REACHED. RETRYING...";
                setTimeout(fetchAllNews, 30000); 
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 600000); 
        setInterval(fetchAllNews, 1800000);
        fetchAllNews();

    </script>
</body>
</html>
